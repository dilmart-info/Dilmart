<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>معاينة DilMart Driver — تجريبية</title>
  <link rel="stylesheet" href="./preview.css">
</head>
<body>
  <div class="stage">
    <p class="demo-flag">معاينة تجريبية ببيانات مصطنعة. لا يوجد دخول أو موقع أو شبكة حقيقية.</p>
    <div id="app" class="phone" data-theme="light" data-screen="UI-07"></div>
    <aside class="demo-panel" aria-label="أدوات المعاينة">
      <h2>أدوات المعاينة</h2>
      <div class="demo-row">
        <button type="button" data-demo="mode-pickup">جمع</button>
        <button type="button" data-demo="mode-delivery">توزيع</button>
        <button type="button" data-demo="mode-hybrid">مختلط</button>
      </div>
      <div class="demo-row">
        <button type="button" data-demo="theme-light">فاتح</button>
        <button type="button" data-demo="theme-dark">داكن UI-54</button>
        <button type="button" data-demo="offline">مؤشر دون اتصال</button>
      </div>
      <div class="demo-row">
        <button type="button" data-demo="device-approved">محاكاة موافقة الجهاز</button>
        <button type="button" data-demo="device-denied">محاكاة رفض الجهاز</button>
      </div>
      <div class="demo-row">
        <button type="button" data-demo="location-allowed">محاكاة السماح بالموقع</button>
        <button type="button" data-demo="location-denied">محاكاة رفض الموقع</button>
        <button type="button" data-demo="offer-expired">محاكاة انتهاء العرض</button>
        <button type="button" data-demo="end-shift">مراجعة إنهاء الوردية</button>
      </div>
      <p class="demo-hint">الرمز التجريبي: <bdi>482196</bdi>. الهاتف التجريبي: <bdi>07701234567</bdi>.</p>
    </aside>
  </div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
